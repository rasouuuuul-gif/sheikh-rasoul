<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شیخ رسول‌الدین قمی</title>

  <meta name="description" content="وب‌سایت رسمی شیخ رسول‌الدین قمی">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f1e8, #e4dacb);
      color: #29251f;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 750px;
      background: #fffdf9;
      border-radius: 28px;
      padding: 50px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      border: 1px solid #ded3c2;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #2d4a3a;
      color: #f5ead8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 18px;
      color: #2d4a3a;
      font-size: clamp(30px, 7vw, 52px);
    }

    .welcome {
      font-size: 20px;
      line-height: 2;
      color: #665f55;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .button-main {
      background: #2d4a3a;
      color: white;
    }

    .button-main:hover {
      opacity: 0.85;
    }

    .button-light {
      border: 1px solid #cfc2af;
      color: #2d4a3a;
      background: white;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #948a7c;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="logo">
        ر
      </div>

      <h1>
        شیخ رسول‌الدین قمی
      </h1>

      <div class="welcome">
        به وب‌سایت رسمی خوش آمدید
      </div>

      <div class="buttons">

        <a class="button button-main" href="#about">
          معرفی
        </a>

        <a class="button button-light" href="#contact">
          ارتباط با ما
        </a>

      </div>

      <div id="about" style="margin-top:40px;">
        <h2>درباره شیخ رسول‌الدین قمی</h2>
        <p style="line-height:2;color:#665f55;">
          اطلاعات و مطالب این بخش به‌زودی اضافه خواهد شد.
        </p>
      </div>

   <div id="contact" style="margin-top:35px;">
  <h2>ارتباط</h2>

  <p style="line-height:2;color:#665f55;">
    برای ارتباط با ما از طریق تلگرام:
  </p>

  <a
    href="https://t.me/girifin"
    target="_blank"
    rel="noopener"
    style="
      display:inline-block;
      margin-top:10px;
      padding:12px 24px;
      border-radius:12px;
      background:#2d4a3a;
      color:white;
      text-decoration:none;
      font-weight:bold;
    "
  >
    📱 تلگرام: @girifin
  </a>
</div>

      <footer>
        © تمامی حقوق محفوظ است
      </footer>

    </div>

  </div>

</body>
</html>

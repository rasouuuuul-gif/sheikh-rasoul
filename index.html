<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شیخ رسول‌الدین قمی</title>

  <meta name="description" content="وب‌سایت رسمی شیخ رسول‌الدین قمی">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f1713, #1d2b24);
      color: #f2eadf;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 750px;
      background: #18231e;
      border-radius: 28px;
      padding: 50px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      border: 1px solid #3c4b42;
    }

    /* عکس پروفایل */
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 25px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #b89b5e;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      background: #2d4a3a;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0 0 18px;
      color: #d8bd78;
      font-size: clamp(30px, 7vw, 52px);
    }

    .welcome {
      font-size: 20px;
      line-height: 2;
      color: #c8c0b4;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .button-main {
      background: #355846;
      color: white;
    }

    .button-main:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .button-light {
      border: 1px solid #6b735f;
      color: #e8d7ae;
      background: #202c26;
    }

    .button-light:hover {
      background: #2b3931;
      transform: translateY(-2px);
    }

    h2 {
      color: #d8bd78;
    }

    #about,
    #contact {
      border-top: 1px solid #34443b;
      padding-top: 25px;
    }

    p {
      color: #c8c0b4;
    }

    .telegram {
      display: inline-block;
      margin-top: 10px;
      padding: 13px 25px;
      border-radius: 12px;
      background: #355846;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .telegram:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #8d948c;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <!-- عکس پروفایل -->
      <div class="logo">
        <img src="profile.jpg" alt="شیخ رسول‌الدین قمی">
      </div>

      <h1>
        شیخ رسول‌الدین قمی
      </h1>

      <div class="welcome">
        به وب‌سایت رسمی خوش آمدید
      </div>

      <div class="buttons">

        <a class="button button-main" href="#about">
          معرفی
        </a>

        <a class="button button-light" href="#contact">
          ارتباط با ما
        </a>

      </div>

      <div id="about" style="margin-top:40px;">

        <h2>
          درباره شیخ رسول‌الدین قمی
        </h2>

        <p style="line-height:2;">
          اطلاعات و مطالب این بخش به‌زودی اضافه خواهد شد.
        </p>

      </div>

      <div id="contact" style="margin-top:35px;">

        <h2>
          ارتباط
        </h2>

        <p style="line-height:2;">
          برای ارتباط با ما از طریق تلگرام:
        </p>

        <a
          class="telegram"
          href="https://t.me/girifin"
          target="_blank"
          rel="noopener"
        >
          📱 تلگرام: @girifin
        </a>

      </div>

      <footer>
        © تمامی حقوق محفوظ است
      </footer>

    </div>

  </div>

</body>
</html>
